---

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ magellan_output_dir }}"
    state: directory
    mode: '0755'

- name: Generate PXE mapping and xnames files
  ansible.builtin.command: >-
    python3 {{ playbook_dir }}/../utils/idrac_discovery.py
    --inventory {{ admin_inventory_path }}
    --output-dir {{ magellan_output_dir }}
  register: magellan_discovery_result
  changed_when: true

- name: Display magellan discovery results
  ansible.builtin.debug:
    msg: "{{ magellan_discovery_result.stdout_lines }}"
