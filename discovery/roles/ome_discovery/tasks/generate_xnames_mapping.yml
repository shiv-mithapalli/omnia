---

- name: Set timestamped xnames mapping file path
  ansible.builtin.set_fact:
    xnames_mapping_file: "{{ pxe_mapping_output_file | dirname }}/xnames_mapping_file_{{ pxe_mapping_timestamp }}.csv"

- name: Identify servers with complete location data
  ansible.builtin.set_fact:
    servers_with_location: "{{ discovered_servers | selectattr('row', 'defined') | selectattr('rack', 'defined') | selectattr('uslot', 'defined') | list }}"

- name: Generate xnames mapping file
  generate_xnames_mapping:
    servers: "{{ servers_with_location }}"
    output_file: "{{ xnames_mapping_file }}"
  register: xnames_result
  when: servers_with_location | length == discovered_servers | length

- name: Display xnames mapping result
  ansible.builtin.debug:
    msg: "Generated xnames mapping file at {{ xnames_result.output_file }} with {{ xnames_result.xnames_count }} entries"
  when: servers_with_location | length == discovered_servers | length

- name: Display xnames generation skipped message
  ansible.builtin.debug:
    msg: "{{ location_data_missing_msg }}"
  when: servers_with_location | length < discovered_servers | length
