---
# Refresh openchami network configs when openchami is already installed.
# This allows network_spec changes (e.g. additional_subnets) to be
# reapplied on re-runs without triggering a full reinstall.

- name: Include provision_config.yml
  block:
    - name: Include provision_config.yml file
      ansible.builtin.include_vars: "{{ provision_config }}"
      no_log: true
  rescue:
    - name: Failed to include provision_config.yml
      ansible.builtin.fail:
        msg: "{{ provision_config_syntax_fail_msg }}"

- name: Include network_spec.yml
  block:
    - name: Include network_spec file
      ansible.builtin.include_vars: "{{ network_spec }}"
      no_log: true
  rescue:
    - name: Failed to include network_spec.yml
      ansible.builtin.fail:
        msg: "{{ network_spec_syntax_fail_msg }}"

- name: Parse network_spec data
  ansible.builtin.set_fact:
    network_data: "{{ network_data | default({}) | combine({item.key: item.value}) }}"
  with_dict: "{{ Networks }}"

- name: Set openchami cluster configuration facts
  ansible.builtin.set_fact:
    cluster_name: "{{ oim_node_name }}"
    cluster_domain: "{{ domain_name }}"
    cluster_boot_ip: "{{ admin_nic_ip }}"
    cluster_boot_interface: "{{ admin_nic }}"
    cluster_shortname: "nid"
    cluster_nidlength: 3

- name: Set openchami network configuration facts
  ansible.builtin.set_fact:
    coredhcp_dhcp_pool: >-
      {{ network_data.admin_network.dynamic_range | split('-') | first }}
      {{ network_data.admin_network.dynamic_range | split('-') | last }}
    coredhcp_netmask: >-
      {{ (admin_nic_ip + '/' + network_data.admin_network.netmask_bits) | ansible.utils.ipaddr('netmask') }}
    coredhcp_router: "{{ network_data.admin_network.router }}"
    coredhcp_lease_duration: "{{ default_lease_time }}s"

- name: Set BMC network facts for refresh
  ansible.builtin.set_fact:
    bmc_details_status: >-
      {{
        network_data.bmc_network | default({}) |
        dict2items |
        selectattr('key', 'in', ['oim_nic_name', 'subnet', 'netmask_bits', 'router', 'dynamic_range']) |
        map(attribute='value') | reject('equalto', '') | list | length == 5
      }}
    bmc_nic: "{{ network_data.bmc_network.oim_nic_name | default('', true) }}"
    bmc_subnet: "{{ network_data.bmc_network.subnet | default('', true) }}"
    bmc_netmask_bits: "{{ network_data.bmc_network.netmask_bits | default('', true) }}"
    bmc_router: "{{ network_data.bmc_network.router | default('', true) }}"
    bmc_dynamic_range: "{{ network_data.bmc_network.dynamic_range | default('', true) }}"
    bmc_additional_subnets: "{{ network_data.bmc_network.additional_subnets | default([]) }}"

- name: Build combined coredhcp subnet and listen interface facts
  ansible.builtin.set_fact:
    coredhcp_subnets: >-
      {{
        [{
          'subnet': network_data.admin_network.subnet,
          'netmask_bits': network_data.admin_network.netmask_bits,
          'router': network_data.admin_network.router,
          'dynamic_range': network_data.admin_network.dynamic_range
        }]
        + network_data.admin_network.additional_subnets | default([])
        + (bmc_details_status | bool | ternary(
            [{
              'subnet': bmc_network.subnet | default(''),
              'netmask_bits': bmc_network.netmask_bits | default(''),
              'router': bmc_network.router | default(''),
              'dynamic_range': bmc_network.dynamic_range | default('')
            }], []
          ))
        + (bmc_details_status | bool | ternary(
            bmc_network.additional_subnets | default([]), []
          ))
      }}
    coredhcp_listen_interfaces: >-
      {{
        ([admin_nic]
        + (bmc_details_status | bool | ternary([bmc_nic], [])))
        | unique
      }}
  vars:
    bmc_network: "{{ network_data.bmc_network | default({}) }}"

- name: Override DNS forwarders from network_spec if configured
  ansible.builtin.set_fact:
    dns_forwarders: "{{ network_data.admin_network.dns }}"
  when: (network_data.admin_network.dns | default([])) | length > 0

- name: Check for admin sparse inventory
  ansible.builtin.stat:
    path: "{{ hostvars['localhost']['input_project_dir'] }}/admin_inventory.csv"
  register: admin_inventory_stat

- name: Set BMC lease handler enabled fact
  ansible.builtin.set_fact:
    bmc_lease_handler_enabled: >-
      {{
        (admin_inventory_stat.stat.exists | default(false))
        and (bmc_details_status | bool)
        and (openchami_coresmd_tag | regex_replace('^v', '') is version('0.6.0', '>='))
      }}

- name: Refresh coredhcp config file
  ansible.builtin.template:
    src: coredhcp/coredhcp.yaml.j2
    dest: "{{ openchami_config_dir }}/coredhcp.yaml"
    owner: root
    group: root
    mode: "{{ file_perm_rw }}"
  register: coredhcp_config_result

- name: Refresh coredns Corefile config
  ansible.builtin.template:
    src: coredns/Corefile.j2
    dest: "{{ openchami_config_dir }}/Corefile"
    owner: root
    group: root
    mode: "{{ file_perm_rw }}"
  register: coredns_config_result

- name: Restart openchami services if configs changed
  ansible.builtin.systemd:
    name: openchami.target
    state: restarted
    daemon_reload: true
  when: coredhcp_config_result.changed or coredns_config_result.changed

- name: Configure and refresh BMC lease handler
  ansible.builtin.include_tasks: bmc_lease_handler.yml
  when: bmc_lease_handler_enabled | bool

- name: Set openchami SELinux context for Local flow
  ansible.builtin.command: chcon -R system_u:object_r:container_file_t:s0 "{{ hostvars['localhost']['oim_shared_path'] }}/omnia/openchami"
  changed_when: true
  failed_when: false
  when: hostvars['localhost']['omnia_share_option'] == 'Local'

- name: Set openchami SELinux context for NFS internal flow
  ansible.builtin.command: chcon -R system_u:object_r:container_file_t:s0 "{{ hostvars['localhost']['nfs_server_share_path'] }}/omnia/openchami"
  changed_when: true
  failed_when: false
  when: (hostvars['localhost']['omnia_share_option'] == 'NFS' and hostvars['localhost']['nfs_type'] | default('') == 'internal')
