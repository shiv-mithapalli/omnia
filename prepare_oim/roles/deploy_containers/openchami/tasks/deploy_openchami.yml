---

- name: Include provision_config.yml
  block:
    - name: Include provision_config.yml file
      ansible.builtin.include_vars: "{{ provision_config }}"
      register: include_provision_config
      no_log: true
      tags: init
  rescue:
    - name: Failed to include provision_config.yml
      ansible.builtin.fail:
        msg: "{{ provision_config_syntax_fail_msg }} Error: {{ include_provision_config.message }}"

- name: Include network_spec.yml
  block:
    - name: Include network_spec file
      ansible.builtin.include_vars: "{{ network_spec }}"
      register: include_network_spec
      no_log: true
  rescue:
    - name: Failed to include network_spec.yml
      ansible.builtin.fail:
        msg: "{{ network_spec_syntax_fail_msg }} Error: {{ include_network_spec.message }}"

- name: Include storage_config.yml
  block:
    - name: Include storage_config.yml file
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['input_project_dir'] }}/storage_config.yml"
      no_log: true
  rescue:
    - name: Set default storage backend if storage_config.yml not found
      ansible.builtin.set_fact:
        s3_configurations:
          provider: "powerscale"
          endpoint_url: ""

- name: Parse network_spec data
  ansible.builtin.set_fact:
    network_data: "{{ network_data | default({}) | combine({item.key: item.value}) }}"
  with_dict: "{{ Networks }}"

- name: Create openchami directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"
  with_items:
    - "{{ openchami_share_dir }}"
    - "{{ openchami_log_dir }}"
  delegate_to: localhost
  connection: local

- name: Verify the openchami clone status
  ansible.builtin.stat:
    path: "{{ openchami_clone_path }}/dell/podman-quadlets"
  register: clone_status
  delegate_to: localhost
  connection: local

- name: Clone the openchami repository
  ansible.builtin.git:
    repo: "{{ openchami_git_repo }}"
    dest: "{{ openchami_clone_path }}"
    version: "{{ openchami_git_version }}"
  register: clone_openchami
  until: clone_openchami is not failed
  retries: "{{ clone_retry }}"
  delay: "{{ clone_delay }}"
  when: not clone_status.stat.exists
  delegate_to: localhost
  connection: local

- name: Load the openchami configs vars
  ansible.builtin.template:
    src: "{{ openchami_config_vars_template }}"
    dest: "{{ openchami_config_vars_path }}"
    mode: "{{ file_permissions_644 }}"
  delegate_to: localhost
  connection: local

- name: Load the openchami inventory
  ansible.builtin.template:
    src: "{{ openchami_inventory_template }}"
    dest: "{{ openchami_inventory_file }}"
    mode: "{{ file_permissions_644 }}"
  delegate_to: localhost
  connection: local

- name: Set openchami cluster configuration facts
  ansible.builtin.set_fact:
    cluster_name: "{{ oim_node_name }}"
    cluster_domain: "{{ domain_name }}"
    cluster_boot_ip: "{{ admin_nic_ip }}"
    cluster_boot_interface: "{{ admin_nic }}"
    cluster_shortname: "nid"
    cluster_nidlength: 3

- name: Set openchami network configuration facts
  ansible.builtin.set_fact:
    coredhcp_dhcp_pool: >-
      {{ network_data.admin_network.dynamic_range | split('-') | first }}
      {{ network_data.admin_network.dynamic_range | split('-') | last }}
    coredhcp_netmask: >-
      {{ (admin_nic_ip + '/' + network_data.admin_network.netmask_bits) | ansible.utils.ipaddr('netmask') }}
    coredhcp_router: "{{ network_data.admin_network.router }}"
    coredhcp_lease_duration: "{{ default_lease_time }}s"

- name: Set multi-subnet coredhcp facts
  ansible.builtin.set_fact:
    additional_subnets: "{{ network_data.admin_network.additional_subnets | default([]) }}"

- name: Build combined coredhcp subnet and listen interface facts
  ansible.builtin.set_fact:
    coredhcp_subnets: >-
      {{
        [{
          'subnet': network_data.admin_network.subnet,
          'netmask_bits': network_data.admin_network.netmask_bits,
          'router': network_data.admin_network.router,
          'dynamic_range': network_data.admin_network.dynamic_range
        }]
        + network_data.admin_network.additional_subnets | default([])
        + (bmc_details_status | bool | ternary(
            [{
              'subnet': bmc_network.subnet | default(''),
              'netmask_bits': bmc_network.netmask_bits | default(''),
              'router': bmc_network.router | default(''),
              'dynamic_range': bmc_network.dynamic_range | default('')
            }], []
          ))
        + (bmc_details_status | bool | ternary(
            bmc_network.additional_subnets | default([]), []
          ))
      }}
    coredhcp_listen_interfaces: >-
      {{
        ([admin_nic]
        + (bmc_details_status | bool | ternary([bmc_nic], [])))
        | unique
      }}
  vars:
    bmc_network: "{{ network_data.bmc_network | default({}) }}"

- name: Configure static routes for additional subnets
  when: network_data.admin_network.additional_subnets | default([]) | length > 0
  block:
    - name: Determine admin network gateway
      ansible.builtin.set_fact:
        admin_gateway: "{{ network_data.admin_network.subnet | ansible.utils.ipmath(1) }}"

    - name: Check existing routes on admin NIC
      ansible.builtin.command: nmcli -g ipv4.routes connection show {{ admin_nic }}
      register: existing_routes
      changed_when: false

    - name: Add persistent routes for additional subnets via NetworkManager
      ansible.builtin.command: >-
        nmcli connection modify {{ admin_nic }}
        +ipv4.routes "{{ item.subnet }}/{{ item.netmask_bits }} {{ admin_gateway }}"
      loop: "{{ network_data.admin_network.additional_subnets }}"
      when: (item.subnet + '/' + item.netmask_bits) not in existing_routes.stdout
      changed_when: true

    - name: Apply route changes to admin NIC
      ansible.builtin.command: nmcli device reapply {{ admin_nic }}
      changed_when: true

- name: Override DNS forwarders from network_spec if configured
  ansible.builtin.set_fact:
    dns_forwarders: "{{ network_data.admin_network.dns }}"
  when: (network_data.admin_network.dns | default([])) | length > 0

- name: Set s3_access_id and s3_secret_key
  ansible.builtin.set_fact:
    s3_access_id: "{{ hostvars['localhost']['s3_access_id'] | default('admin', true) }}"
    s3_secret_key: "{{ hostvars['localhost']['s3_secret_key'] }}"
  no_log: true

- name: Set storage backend fact
  ansible.builtin.set_fact:
    storage_backend: "{{ s3_configurations.provider | lower }}"

- name: Check for admin sparse inventory
  ansible.builtin.stat:
    path: "{{ hostvars['localhost']['input_project_dir'] }}/admin_inventory.csv"
  register: admin_inventory_stat

- name: Set BMC lease handler enabled fact
  ansible.builtin.set_fact:
    bmc_lease_handler_enabled: >-
      {{
        (admin_inventory_stat.stat.exists | default(false))
        and (bmc_details_status | bool)
        and (openchami_coresmd_tag | regex_replace('^v', '') is version('0.6.0', '>='))
      }}

- name: Deploy openchami configs
  block:
    - name: Install and configure openchami
      ansible.builtin.include_tasks: configs/main.yml
  rescue:
    - name: Openchami installation failed
      ansible.builtin.fail:
        msg: "{{ openchami_install_fail_msg }}"

- name: Configure BMC lease handler
  ansible.builtin.include_tasks: bmc_lease_handler.yml
  when: bmc_lease_handler_enabled | bool
 
- name: Set openchami SELinux context for Local flow
  ansible.builtin.command: chcon -R system_u:object_r:container_file_t:s0 "{{ hostvars['localhost']['oim_shared_path'] }}/omnia/openchami"
  changed_when: true
  failed_when: false
  when: hostvars['localhost']['omnia_share_option'] == 'Local'

- name: Set openchami SELinux context for NFS internal flow
  ansible.builtin.command: chcon -R system_u:object_r:container_file_t:s0 "{{ hostvars['localhost']['nfs_server_share_path'] }}/omnia/openchami"
  changed_when: true
  failed_when: false
  when: (hostvars['localhost']['omnia_share_option'] == 'NFS' and hostvars['localhost']['nfs_type'] | default('') == 'internal')
